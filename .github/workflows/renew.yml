name: ACLClouds Auto Renew

on:
  schedule:
    # 每天执行一次，对应北京时间 (UTC+8) 早上 07:28 (即 UTC 23:28)
    - cron: '28 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: auth.json
          key: acl-session-${{ github.run_id }}
          restore-keys: |
            acl-session-

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Auto Renew
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_SERVER_ID: ${{ secrets.ACL_SERVER_ID }}
          ACL_BASE_URL: ${{ vars.ACL_BASE_URL || 'https://aclclouds.com' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node renew.mjs

      - name: Upload Screenshots on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-screenshots-${{ github.run_id }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 5
